# Render Blueprint — backend API + managed Postgres (pgvector is available on Render Postgres).
# New > Blueprint > pick this repo. Then set CORS_ORIGINS to your Vercel URL (see DEPLOYMENT.md).
services:
  - type: web
    name: novatech-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: novatech-db, property: connectionString }
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false              # e.g. https://your-app.vercel.app
      - key: SEED_DEMO_DATA
        value: "true"            # seeds once, only while the database is empty
      - key: OPENAI_API_KEY
        sync: false              # optional — deterministic engine runs without it
      - key: OPENAI_MODEL
        sync: false              # optional

databases:
  - name: novatech-db
    plan: free
    databaseName: novatech
    user: novatech
